name: 'Setup Dev Environment'
description: 'Checkout, GCP auth, mise, uv, and dev tools'

runs:
  using: 'composite'
  steps:

    - name: Install mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

    - name: Initialize mise and install Python dependencies
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: mise run install
